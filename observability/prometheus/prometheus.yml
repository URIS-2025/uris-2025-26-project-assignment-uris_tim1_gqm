global:
  scrape_interval: 20s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'dotnet-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'user-service:8080'
        - 'department-service:8080'
        - 'goal-service:8080'
        - 'premise-service:8080'
        - 'gqm-goal-service:8080'
        - 'assessment-service:8080'
        - 'orchestration-service:8080'
        - 'audit-service:8080'
