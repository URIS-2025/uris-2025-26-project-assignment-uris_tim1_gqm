<div class="goals-list-page page-enter">
    <app-page-header title="Goals" subtitle="Manage your organisational goals.">
        <ng-template #actions>
            <a [hasPermission]="'create_goals'" permissionMode="disable" mat-flat-button routerLink="/goals/new"
                id="btn-new-goal">
                <mat-icon>add</mat-icon> New Goal
            </a>
        </ng-template>
    </app-page-header>

    @if (loading) {
    <div class="loading-wrap">
        <mat-spinner diameter="40"></mat-spinner>
    </div>
    } @else if (goals.length === 0) {
    <div class="empty-state">
        <span class="material-icons-round">flag</span>
        <p>No goals yet. <a routerLink="/goals/new">Create your first goal.</a></p>
    </div>
    } @else {
    <div class="table-card">
        <table mat-table [dataSource]="goals" class="goal-table">

            <ng-container matColumnDef="focus">
                <th mat-header-cell *matHeaderCellDef>Focus</th>
                <td mat-cell *matCellDef="let g">
                    <a [routerLink]="['/goals', g.id]" class="goal-link">{{ g.focus }}</a>
                </td>
            </ng-container>

            <ng-container matColumnDef="object">
                <th mat-header-cell *matHeaderCellDef>Object</th>
                <td mat-cell *matCellDef="let g">{{ g.object }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let g">
                    <span [class]="'chip ' + (statusColors[g.status])">
                        {{ g.status }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="activeFrom">
                <th mat-header-cell *matHeaderCellDef>From</th>
                <td mat-cell *matCellDef="let g">{{ formatDate(g.activeFrom) }}</td>
            </ng-container>

            <ng-container matColumnDef="activeTo">
                <th mat-header-cell *matHeaderCellDef>To</th>
                <td mat-cell *matCellDef="let g">{{ formatDate(g.activeTo) }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let g" class="actions-cell">
                    <a mat-icon-button [routerLink]="['/goals', g.id]" title="View">
                        <mat-icon>visibility</mat-icon>
                    </a>
                    <button [hasPermission]="'delete_goals'" permissionMode="disable" mat-icon-button class="btn-danger"
                        (click)="deleteGoal(g)" title="Delete">
                        <mat-icon>delete_outline</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [length]="totalCount" [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50]"
            (page)="onPage($event)"></mat-paginator>
    </div>
    }
</div>
