events {
    worker_connections 1024;
}

http {
    # Generate X-Correlation-Id if not provided by the client.
    # Uses nginx built-in $request_id as fallback (unique per request).
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    upstream department-service {
        server department-service:8080;
    }

    upstream goal-service {
        server goal-service:8080;
    }

    upstream premise-service {
        server premise-service:8080;
    }

    upstream gqm-goal-service {
        server gqm-goal-service:8080;
    }

    upstream assessment-service {
        server assessment-service:8080;
    }

    upstream user-service {
        server user-service:8080;
    }

    upstream orchestration-service {
        server orchestration-service:8080;
    }

    upstream audit-service {
        server audit-service:8080;
    }

    upstream angular-client {
        server angular-client:80;
    }

    server {
        listen 80;

        # Return X-Correlation-Id in all responses
        add_header X-Correlation-Id $correlation_id always;

        # Department Service
        location /api/v1/department {
            proxy_pass http://department-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/organization {
            proxy_pass http://department-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Goal Service
        location /api/v1/goal {
            proxy_pass http://goal-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/strategy {
            proxy_pass http://goal-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/goalinfluence {
            proxy_pass http://goal-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Premise Service
        location /api/v1/premise {
            proxy_pass http://premise-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # GQM Goal Service
        location /api/v1/gqmgoal {
            proxy_pass http://gqm-goal-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/question {
            proxy_pass http://gqm-goal-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/target {
            proxy_pass http://gqm-goal-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/measurement {
            proxy_pass http://gqm-goal-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Assessment Service
        location /api/v1/assessment {
            proxy_pass http://assessment-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # User Service
        location /api/v1/user {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/auth {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/permission {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/role {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
        location /api/v1/userorganizationrole {
            proxy_pass http://user-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Organization-Id $http_x_organization_id;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Orchestration Service
        location /api/v1/workflow {
            proxy_pass http://orchestration-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Audit Service
        location /api/v1/auditlog {
            proxy_pass http://audit-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        # Angular SPA — catch-all (must be last)
        location / {
            proxy_pass http://angular-client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
