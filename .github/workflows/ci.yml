name: CI - Build & Test

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  MSBUILDFAILONDRIVEENUMERATINGWILDCARD: 0

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'docker-compose.yaml'
      - 'nginx.conf'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, dev ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      department: ${{ steps.filter.outputs.department }}
      goal: ${{ steps.filter.outputs.goal }}
      premise: ${{ steps.filter.outputs.premise }}
      gqm-goal: ${{ steps.filter.outputs.gqm-goal }}
      assessment: ${{ steps.filter.outputs.assessment }}
      user: ${{ steps.filter.outputs.user }}  
      orchestration: ${{ steps.filter.outputs.orchestration }}
      audit: ${{ steps.filter.outputs.audit }}
      shared: ${{ steps.filter.outputs.shared }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |

            department:
              - 'services/department-service/**'
            goal:
              - 'services/goal-service/**'
            premise:
              - 'services/premise-service/**'
            gqm-goal:
              - 'services/gqm-goal-service/**'
            assessment:
              - 'services/assessment-service/**'
            user:
              - 'services/user-service/**'
            orchestration:
              - 'services/orchestration-service/**'
            audit:
              - 'services/audit-service/**'
            shared:
              - 'shared/**'
            infrastructure:
              - 'docker-compose.yaml'
              - 'nginx.conf'
            e2e:
              - 'tests/E2E.Tests/**'
  
  build-department:
    needs: detect-changes
    if: needs.detect-changes.outputs.department == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Department Service
        run: dotnet build services/department-service/DepartmentService.API/DepartmentService.API.csproj --configuration Release
      - name: Run Department Service Tests
        run: dotnet test services/department-service/DepartmentService.Tests/DepartmentService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Department Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx
  
  build-goal:
    needs: detect-changes
    if: needs.detect-changes.outputs.goal == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Goal Service
        run: dotnet build services/goal-service/GoalService.API/GoalService.API.csproj --configuration Release
      - name: Run Goal Service Tests
        run: dotnet test services/goal-service/GoalService.Tests/GoalService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Goal Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx
  
  build-premise:
    needs: detect-changes
    if: needs.detect-changes.outputs.premise == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Premise Service
        run: dotnet build services/premise-service/PremiseService.API/PremiseService.API.csproj --configuration Release
      - name: Run Premise Service Tests
        run: dotnet test services/premise-service/PremiseService.Tests/PremiseService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Premise Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx
  
  build-gqm-goal:
    needs: detect-changes
    if: needs.detect-changes.outputs.gqm-goal == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build gqm-Goal Service
        run: dotnet build services/gqm-goal-service/GQMGoalService.API/GQMGoalService.API.csproj --configuration Release
      - name: Run gqm-Goal Service Tests
        run: dotnet test services/gqm-goal-service/GQMGoalService.Tests/GQMGoalService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: gqm-Goal Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx
  
  build-assessment:
    needs: detect-changes
    if: needs.detect-changes.outputs.assessment == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Assessment Service
        run: dotnet build services/assessment-service/AssessmentService.API/AssessmentService.API.csproj --configuration Release
      - name: Run Assessment Service Tests
        run: dotnet test services/assessment-service/AssessmentService.Tests/AssessmentService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Assessment Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx

  build-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
