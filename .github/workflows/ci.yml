      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Shared.Contracts
        run: dotnet build shared/Shared.Contracts/Shared.Contracts.csproj --configuration Release
      - name: Build User Service
        run: dotnet build services/user-service/UserService.API/UserService.API.csproj --configuration Release
      - name: Run User Service Tests
        run: dotnet test services/user-service/UserService.Tests/UserService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: User Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx

  build-audit:
    needs: detect-changes
    if: needs.detect-changes.outputs.audit == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Shared.Contracts
        run: dotnet build shared/Shared.Contracts/Shared.Contracts.csproj --configuration Release
      - name: Build Audit Service
        run: dotnet build services/audit-service/AuditService.API/AuditService.API.csproj --configuration Release
      - name: Run Audit Service Tests
        run: dotnet test services/audit-service/AuditService.Tests/AuditService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Audit Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx
  
  build-orchestration:
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestration == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Orchestration Service
        run: dotnet build services/orchestration-service/OrchestrationService.API/OrchestrationService.API.csproj --configuration Release
      - name: Run Orchestration Service Tests
        run: dotnet test services/orchestration-service/OrchestrationService.Tests/OrchestrationService.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Orchestration Service Tests
          path: test-results/*.trx
          reporter: dotnet-trx

  build-e2e:
    needs: [detect-changes, build-goal, build-audit, build-orchestration]
    if: |
      always() && 
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.detect-changes.outputs.goal == 'true' || 
       needs.detect-changes.outputs.audit == 'true' || 
       needs.detect-changes.outputs.orchestration == 'true' ||
       needs.detect-changes.outputs.shared == 'true' ||
       needs.detect-changes.outputs.infrastructure == 'true' ||
       needs.detect-changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-e2e-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-e2e-${{ runner.os }}-
      - name: Build E2E Tests
        run: dotnet build tests/E2E.Tests/E2E.Tests.csproj --configuration Release
      - name: Run E2E Tests
        run: dotnet test tests/E2E.Tests/E2E.Tests.csproj --configuration Release --verbosity normal --logger trx --results-directory test-results
      - name: Publish E2E Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Integration Tests
          path: test-results/*.trx
          reporter: dotnet-trx

