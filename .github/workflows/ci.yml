name: CI - Build & Test

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'docker-compose.yaml'
      - 'nginx.conf'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, dev ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      access: ${{ steps.filter.outputs.access }}
      department: ${{ steps.filter.outputs.department }}
      goal: ${{ steps.filter.outputs.goal }}
      premise: ${{ steps.filter.outputs.premise }}
      qgm-goal: ${{ steps.filter.outputs.qgm-goal }}
      assessment: ${{ steps.filter.outputs.assessment }}
      shared: ${{ steps.filter.outputs.shared }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            access:
              - 'services/access-service/**'
            department:
              - 'services/department-service/**'
            goal:
              - 'services/goal-service/**'
            premise:
              - 'services/premise-service/**'
            qgm-goal:
              - 'services/qgm-goal-service/**'
            assessment:
              - 'services/assessment-service/**'
            shared:
              - 'shared/**'
            infrastructure:
              - 'docker-compose.yaml'
              - 'nginx.conf'
  
  build-access:
    needs: detect-changes
    if: needs.detect-changes.outputs.access == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Access Service
        run: dotnet build services/access-service/AccessService.API/AccessService.API.csproj --configuration Release
      - name: Run Access Service Tests
        run: dotnet test services/access-service/AccessService.Tests/AccessService.Tests.csproj --configuration Release --verbosity normal
  
  build-department:
    needs: detect-changes
    if: needs.detect-changes.outputs.department == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Department Service
        run: dotnet build services/department-service/DepartmentService.API/DepartmentService.API.csproj --configuration Release
      - name: Run Department Service Tests
        run: dotnet test services/department-service/DepartmentService.Tests/DepartmentService.Tests.csproj --configuration Release --verbosity normal
  
  build-goal:
    needs: detect-changes
    if: needs.detect-changes.outputs.goal == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Goal Service
        run: dotnet build services/goal-service/GoalService.API/GoalService.API.csproj --configuration Release
      - name: Run Goal Service Tests
        run: dotnet test services/goal-service/GoalService.Tests/GoalService.Tests.csproj --configuration Release --verbosity normal
  
  build-premise:
    needs: detect-changes
    if: needs.detect-changes.outputs.premise == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Premise Service
        run: dotnet build services/premise-service/PremiseService.API/PremiseService.API.csproj --configuration Release
      - name: Run Premise Service Tests
        run: dotnet test services/premise-service/PremiseService.Tests/PremiseService.Tests.csproj --configuration Release --verbosity normal
  
  build-qgm-goal:
    needs: detect-changes
    if: needs.detect-changes.outputs.qgm-goal == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build QGM-Goal Service
        run: dotnet build services/qgm-goal-service/QGMGoalService.API/QGMGoalService.API.csproj --configuration Release
      - name: Run QGM-Goal Service Tests
        run: dotnet test services/qgm-goal-service/QGMGoalService.Tests/QGMGoalService.Tests.csproj --configuration Release --verbosity normal
  
  build-assessment:
    needs: detect-changes
    if: needs.detect-changes.outputs.assessment == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Shared.HMAC
        run: dotnet build shared/Shared.HMAC/Shared.HMAC.csproj --configuration Release
      - name: Build Assessment Service
        run: dotnet build services/assessment-service/AssessmentService.API/AssessmentService.API.csproj --configuration Release
      - name: Run Assessment Service Tests
        run: dotnet test services/assessment-service/AssessmentService.Tests/AssessmentService.Tests.csproj --configuration Release --verbosity normal
  
  docker-build:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-access, build-department, build-goal, build-premise, build-qgm-goal, build-assessment]
    if: |
      always() && 
      !cancelled() &&
      (needs.detect-changes.outputs.infrastructure == 'true' || 
       needs.detect-changes.outputs.shared == 'true' ||
       needs.detect-changes.outputs.access == 'true' ||
       needs.detect-changes.outputs.department == 'true' ||
       needs.detect-changes.outputs.goal == 'true' ||
       needs.detect-changes.outputs.premise == 'true' ||
       needs.detect-changes.outputs.qgm-goal == 'true' ||
       needs.detect-changes.outputs.assessment == 'true')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build changed services only
      run: |
        SERVICES=""
        if [ "${{ needs.detect-changes.outputs.access }}" == "true" ] || [ "${{ needs.detect-changes.outputs.shared }}" == "true" ]; then
          SERVICES="$SERVICES access-service"
        fi
        if [ "${{ needs.detect-changes.outputs.department }}" == "true" ] || [ "${{ needs.detect-changes.outputs.shared }}" == "true" ]; then
          SERVICES="$SERVICES department-service"
        fi
        if [ "${{ needs.detect-changes.outputs.goal }}" == "true" ] || [ "${{ needs.detect-changes.outputs.shared }}" == "true" ]; then
          SERVICES="$SERVICES goal-service"
        fi
        if [ "${{ needs.detect-changes.outputs.premise }}" == "true" ] || [ "${{ needs.detect-changes.outputs.shared }}" == "true" ]; then
          SERVICES="$SERVICES premise-service"
        fi
        if [ "${{ needs.detect-changes.outputs.qgm-goal }}" == "true" ] || [ "${{ needs.detect-changes.outputs.shared }}" == "true" ]; then
          SERVICES="$SERVICES qgm-goal-service"
        fi
        if [ "${{ needs.detect-changes.outputs.assessment }}" == "true" ] || [ "${{ needs.detect-changes.outputs.shared }}" == "true" ]; then
          SERVICES="$SERVICES assessment-service"
        fi
        
        if [ -z "$SERVICES" ]; then
          echo "No services to build"
          exit 0
        fi
        
        echo "Building services: $SERVICES"
        docker compose build $SERVICES
    
    - name: Verify Docker images
      run: |
        docker images | grep uris-2025-26-project-assignment-uris_tim1_gqm || true
